name: bussolaapp

services:
  postgres:
    image: postgres:16-alpine
    container_name: bussolaapp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bussola123}
      POSTGRES_DB: ${POSTGRES_DB:-bussolaapp_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    networks:
      - bussolaapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bussolaapp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: bussolaapp_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-bussola123}@postgres:5432/${POSTGRES_DB:-bussolaapp_db}
      - TEST_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-bussola123}@postgres:5432/bussolaapp_test
      - SUPER_ADMIN_NAME=${SUPER_ADMIN_NAME:-Aryaraj}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-aryarajmarketing@gmail.com}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-123456}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-bussolaapp_secret_key_development_change_in_production}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-168}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:3000}
    ports:
      - "8005:8000"
    volumes:
      - ../backend:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - bussolaapp_network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: bussolaapp_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8005
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - bussolaapp_network

volumes:
  postgres_data:
    driver: local

networks:
  bussolaapp_network:
    driver: bridge
